:root{
  /* Layout: phone-shaped column — pixel scene on top (integer-scaled canvas), quest strip + control panel below, tab bar pinned at the bottom. Single dark "gym at night" look by design. */
  --bg:#110f17; --frame:#1a1823; --panel:#201e2b; --card:#292737; --card2:#333045; --line:#3d3951;
  --text:#f1e8d4; --muted:#a49cb6; --red:#d9473f; --blue:#4062d6; --green:#72c94e; --gold:#f2c14e;
  --f-pix:"Press Start 2P", ui-monospace, "Courier New", monospace;
  --f-body:"Rubik", "Trebuchet MS", system-ui, sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.3;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
img.px{image-rendering:pixelated;image-rendering:crisp-edges}
#app{max-width:440px;margin:0 auto;height:100%;display:flex;flex-direction:column;background:var(--frame);position:relative;overflow:hidden;box-shadow:0 0 0 1px #000}

.hud{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#0d0c12;border-bottom:2px solid #000;flex:none}
.res{font-family:var(--f-pix);font-size:11px;display:flex;align-items:baseline;gap:6px;white-space:nowrap;font-variant-numeric:tabular-nums}
.res .ic{color:var(--gold)}
.res.fame .ic{color:#ff9e5a}
.res small{font-family:var(--f-body);font-size:12px;color:var(--muted)}
.cond{flex:1;min-width:0}
.cond label{display:block;font-size:11px;color:var(--muted);line-height:1;margin-bottom:3px;white-space:nowrap}
.bar{height:8px;background:#000;border:1px solid #000;box-shadow:inset 0 0 0 1px #3a3648;position:relative;overflow:hidden}
.bar i{position:absolute;inset:1px auto 1px 1px;background:var(--green);display:block;width:0;transition:width .2s linear}
.iconbtn{width:30px;height:30px;display:grid;place-items:center;background:var(--card);border:2px solid #000;font-family:var(--f-pix);font-size:10px;color:var(--muted);flex:none}

.stage{position:relative;flex:none;background:#07060b;display:flex;justify-content:center;overflow:hidden}
#cv{display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:manipulation}
.scene-tag{position:absolute;left:8px;bottom:8px;font-family:var(--f-pix);font-size:8px;background:#000c;padding:5px 7px;border:1px solid #fff2;pointer-events:none}
.tap-hint{position:absolute;right:8px;bottom:8px;font-size:12px;background:#000c;padding:3px 7px;border:1px solid #fff2;pointer-events:none;color:var(--gold)}
.tap-hint.top{top:44px;bottom:auto;right:auto;left:50%;transform:translateX(-50%)}

.fhud{position:absolute;left:0;right:0;top:0;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:6px;padding:6px 8px;align-items:center;pointer-events:none}
.fside{display:flex;gap:6px;align-items:center;min-width:0}
.fside.r{flex-direction:row-reverse}
.pt{width:48px;height:48px;border:2px solid #000;flex:none;background:#000}
.fside .col{flex:1;min-width:0}
.fname{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:1px 1px 0 #000,-1px 0 0 #000}
.fside.r .fname{text-align:right}
.hp{height:10px;background:#111;border:2px solid #000;position:relative;overflow:hidden;margin-top:3px}
.hp i{position:absolute;top:0;bottom:0;left:0;background:linear-gradient(#8fe063 0 45%,#5fae3d 45%);transition:width .15s}
.fside.r .hp i{left:auto;right:0}
.fmid{background:#0c0b10;border:2px solid #cfc6b4;padding:3px 6px;text-align:center}
.timer{font-family:var(--f-pix);font-size:14px;font-variant-numeric:tabular-nums}
.round{font-family:var(--f-pix);font-size:7px;color:var(--muted);margin-top:3px;white-space:nowrap}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:7px 12px;background:#15131d;border-top:2px solid #000;border-bottom:2px solid #000;flex:none}
.st{min-width:0}
.st .t{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--f-pix);font-size:8px;margin-bottom:4px}
.st .t b{font-size:10px;color:var(--text)}
.st .bar{height:6px}
.st .rate{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap}
.quest{display:flex;gap:10px;align-items:center;padding:7px 12px;background:#1d1a14;border-bottom:2px solid #000;flex:none}
.quest .qi{width:24px;height:24px;flex:none;background:var(--gold);color:#2a1d05;border:2px solid #000;display:grid;place-items:center;font-family:var(--f-pix);font-size:10px}
.quest .grow{flex:1;min-width:0}
.quest .qt{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quest .bar{height:5px;margin-top:3px}
.quest .bar i{background:var(--gold)}

#panel{flex:1;min-height:0;overflow-y:auto;padding-block:10px 14px;padding-inline:12px;display:flex;flex-direction:column;gap:8px;overscroll-behavior:contain}
.sec{font-family:var(--f-pix);font-size:9px;color:var(--muted);display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:6px;letter-spacing:.04em}
.sec span{font-family:var(--f-body);font-size:12px;letter-spacing:0;text-align:right}
.card{background:var(--card);border:2px solid #000;box-shadow:inset 0 0 0 1px var(--line);padding:9px 10px;display:flex;gap:10px;align-items:center}
.card.hero{background:var(--card2)}
.card .grow{flex:1;min-width:0}
.ttl{font-weight:500;font-size:15px}
.sub{font-size:13px;color:var(--muted)}
.lbl{font-family:var(--f-pix);font-size:7px;color:var(--muted);margin-bottom:4px;letter-spacing:.06em}
.ico{width:34px;height:34px;flex:none;border:2px solid #000;display:grid;place-items:center;font-family:var(--f-pix);font-size:8px;color:#000}
.btns{display:flex;gap:6px;align-items:center;flex:none}
.btn{font-family:var(--f-pix);font-size:9px;padding:9px 9px;border:2px solid #000;background:var(--card2);box-shadow:inset 0 -3px 0 #0006;white-space:nowrap;line-height:1}
.btn:active{transform:translateY(1px);box-shadow:inset 0 -1px 0 #0006}
.btn.gold{background:var(--gold);color:#2a1d05}
.btn.red{background:var(--red);color:#fff}
.btn.blue{background:var(--blue);color:#fff}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.btn.sel{background:#2e4590;color:#eef2ff}
.ico2{width:36px;height:36px;border:2px solid #000;flex:none;image-rendering:pixelated;image-rendering:crisp-edges}
.btn.off{background:#2a2836;color:#6e6880;box-shadow:none;cursor:default}
.btn.big{font-size:11px;padding:13px 12px}
.pill{font-family:var(--f-pix);font-size:7px;padding:5px 6px;border:1px solid currentColor;color:var(--green);white-space:nowrap}
.pill.mute{color:var(--muted)} .pill.gold{color:var(--gold)}
.note{font-size:13px;color:var(--muted);background:#17151f;border:1px dashed var(--line);padding:8px 10px}
.note b{color:var(--text)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--f-pix);font-size:8px;padding:7px 8px;border:2px solid #000;background:var(--card);color:var(--muted)}
.chip.on{background:var(--text);color:#16131c}
.opp.locked,.card.locked{opacity:.5}
.tag{font-size:12px;padding:1px 5px;background:#000;margin-left:4px;white-space:nowrap}
.up{color:var(--green)} .dn{color:#ff7a6e}
.tiers{display:flex;gap:3px;margin-top:5px}
.tiers i{width:14px;height:5px;background:#000;box-shadow:inset 0 0 0 1px var(--line)}
.tiers i.on{background:var(--gold);box-shadow:none}
.toggle{min-width:64px}
.arena-hud{position:absolute;inset:0;pointer-events:none;padding:7px 8px;background:linear-gradient(#0d0c1288,transparent 26%)}
.ah-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ah-belt{display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--f-pix);font-size:8px;color:var(--gold);text-shadow:1px 1px 0 #000}
.arena-hud .chips{pointer-events:auto}
.arena-hud .chip{background:#000b;color:#d8d0e8;border-color:#000}.arena-hud .chip.on{background:var(--gold);color:#2a1d05}
.arena-hud .ab{display:flex;align-items:flex-end;gap:8px}
.arena-hud .grow{flex:1;min-width:0}
.arena-hud .lbl{color:#ffd98a;margin-bottom:4px}
.arena-hud .ap{height:6px;width:70%;background:#000;box-shadow:0 0 0 1px #3d3951;margin-bottom:4px}.arena-hud .ap i{display:block;height:100%;background:var(--gold)}
.arena-hud .as{font-size:12px;color:#e8e0f4;line-height:1.35;text-shadow:1px 1px 0 #000}.arena-hud .as b{color:var(--gold)}
.arena-hud .abelt{width:36px;height:36px;flex:none;image-rendering:pixelated;filter:grayscale(.85) brightness(.75)}.arena-hud .abelt.got{filter:drop-shadow(0 0 6px #f2c14eaa)}
.arena{position:relative;flex:none;min-height:116px;background:#07060b center top/cover no-repeat;border:2px solid #000;image-rendering:pixelated}
.arena .av{position:absolute;inset:0;background:linear-gradient(#0d0c1266,transparent 30%,#0d0c12f0 92%);display:flex;flex-direction:column;justify-content:space-between;padding:7px 8px}
.arena .chip{background:#000b;color:#d8d0e8;border-color:#000}.arena .chip.on{background:var(--gold);color:#2a1d05}
.arena .ab{display:flex;align-items:flex-end;gap:8px}
.arena .grow{flex:1;min-width:0}
.arena .lbl{color:#ffd98a;margin-bottom:4px}
.arena .ap{height:6px;width:70%;background:#000;box-shadow:0 0 0 1px #3d3951;margin-bottom:4px}.arena .ap i{display:block;height:100%;background:var(--gold)}
.arena .as{font-size:12px;color:#d8d0e8;line-height:1.35}.arena .as b{color:var(--gold)}
.arena .abelt{width:52px;height:52px;flex:none;image-rendering:pixelated;filter:grayscale(.85) brightness(.75)}.arena .abelt.got{filter:drop-shadow(0 0 6px #f2c14eaa)}
#panel{gap:6px;padding-block:8px 12px}
#panel .sec{margin-top:2px}
#panel .card.row{padding:6px 9px;gap:9px;min-height:52px}
#panel .card.row .ttl{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#panel .card.row .sub{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#panel .card.row .lbl{margin-bottom:3px}
#panel .card .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#panel .card.row .ico2{width:32px;height:32px}
#panel .card.row .pt{width:36px;height:36px}
#panel .card.row .btn{padding:8px 8px}
#panel .card.row .btn.big{padding:12px 10px;font-size:10px}
#panel .card.row[data-act=focus]{cursor:pointer}
#panel .card.row.sel{box-shadow:inset 0 0 0 2px var(--green);background:#1f2a1c}
.nowtag{font-style:normal;font-family:var(--f-pix);font-size:7px;color:var(--green);margin-left:6px;vertical-align:1px}
.stats{padding:5px 12px}
.st .t{margin-bottom:3px}
.st .bar{height:5px}
.st .rate{display:none}
.quest{padding:5px 12px;gap:8px}
.quest .qi{width:20px;height:20px;font-size:8px}
.quest .lbl{display:none}
.quest .qt{font-size:13px}
.quest .bar{height:4px;margin-top:3px}
.quest .btn{padding:7px 7px}

.tabs{display:grid;grid-template-columns:repeat(5,1fr);background:#0d0c12;border-top:2px solid #000;flex:none}
.tab{position:relative;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:5px;font-family:var(--f-pix);font-size:7px;color:#7d7690}
.tab svg{width:20px;height:20px;shape-rendering:crispEdges}
.tab.on{color:var(--gold);background:#1c1a26;box-shadow:inset 0 3px 0 var(--gold)}
.tab .dot{position:absolute;top:6px;left:calc(50% + 8px);width:8px;height:8px;background:var(--red);border:2px solid #000}

#fightCtl{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px;background:#15131d}
.meters{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.meters label{font-family:var(--f-pix);font-size:8px;color:var(--muted);display:block;margin-bottom:4px}
.meters .bar{height:10px}
#stamBar{background:#5ab4e0} #supBar{background:var(--gold)}
.tac{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.tac b{color:var(--text)}
.fbtns{flex:1;display:grid;grid-template-columns:1fr .8fr 1.2fr;gap:8px;min-height:96px;max-height:300px}
.corner{flex:none;overflow:hidden;display:flex;flex-direction:column;gap:8px;background:#1b1925;border:2px solid #000;box-shadow:inset 0 0 0 1px var(--line);padding:9px 10px}
.corner .ch{display:flex;gap:10px;align-items:center}
.corner .ch img{width:40px;height:40px;border:2px solid #000;flex:none;image-rendering:pixelated;background:#3a3946}
.corner .cl{font-family:var(--f-pix);font-size:7px;color:var(--muted);margin-bottom:5px;letter-spacing:.04em}
.corner .tip{font-size:15px;line-height:1.3;color:var(--text);min-height:2.6em}
.corner .tip.m{color:var(--muted);font-style:italic}.corner .tip.r{color:#ff7a6e}.corner .tip.g{color:#8fe36a}.corner .tip.y{color:var(--gold)}
.fb{border:3px solid #000;font-family:var(--f-pix);font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;box-shadow:inset 0 -6px 0 #0005;touch-action:none}
.fb small{font-family:var(--f-body);font-size:12px;opacity:.85}
.fb:active,.fb.press{transform:translateY(2px);box-shadow:inset 0 -2px 0 #0005}
#bBlock{background:var(--blue);color:#fff}
.upwrap{flex:1;display:flex;flex-direction:column;gap:8px;min-height:0}
.uplbl{font-family:var(--f-pix);font-size:10px;color:#ff7a6e;text-align:center;animation:pulse .5s steps(2) infinite}
.upbar{height:16px}
#upBar{background:var(--green)}
#bUp{flex:1;background:var(--gold);color:#2a1d05;font-size:16px;max-height:190px}
#bPunch{background:var(--red);color:#fff}
#bSuper{background:#3a3546;color:#7d7690}
#bSuper.ready{background:var(--gold);color:#2a1d05;animation:pulse .6s steps(2) infinite}
#bPunch.cue{box-shadow:inset 0 -6px 0 #0005,0 0 0 3px var(--green);background:#2f9a3a}
#bBlock.cue{box-shadow:inset 0 -6px 0 #0005,0 0 0 3px #ff3b30}
#bPunch.chg{background:linear-gradient(to top,#ff9a3c var(--chg,0%),#7a2a22 var(--chg,0%));box-shadow:inset 0 -6px 0 #0005,0 0 0 3px #ff9a3c}
#bPunch.full{background:#ffb347;color:#2a1d05;animation:pulse .25s steps(2) infinite}
@keyframes pulse{50%{filter:brightness(1.25)}}
.frow{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#6e6880}
.linkbtn{font-size:12px;color:var(--muted);text-decoration:underline}


/* result sheet (variant B) */
#resSheet{position:absolute;left:0;right:0;bottom:0;z-index:25;background:#221f2e;border-top:4px solid #000;box-shadow:0 -4px 0 #3d3951,0 -30px 40px #0008;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:9px;overflow-y:auto;transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.9,.3,1.1)}
#resSheet.on{transform:none}
.ringnote{display:flex;align-items:center;gap:8px}.ringnote>span{flex:1;min-width:0}
.rankbtn{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;background:#2a2516;border:2px solid #000;box-shadow:inset 0 0 0 2px #8a6a2a;color:var(--gold);padding:5px 8px;cursor:pointer;font:inherit}
.rankbtn b{font-family:var(--f-pix);font-size:9px;display:flex;align-items:center;gap:4px}.rankbtn small{font-size:10px;color:var(--muted);line-height:1}
.rankbtn:active{transform:translateY(1px)}
#lbSheet{position:absolute;inset:0;z-index:30;background:#16141e;display:flex;flex-direction:column;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.9,.3,1)}
#lbSheet.on{transform:none}
.lbhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.lbt{font-family:var(--f-pix);font-size:12px;color:var(--gold);line-height:1.5}.lbsub{font-size:11px;color:var(--muted)}
.lbmine{display:flex;align-items:center;gap:9px;background:linear-gradient(90deg,#3a2a14,#232031);border:2px solid #000;box-shadow:inset 0 0 0 2px #8a6a2a;padding:7px 9px}
.lbmine .lbn{font-size:15px}.lbmine .lbn b{color:var(--gold)}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:6px}
.pod{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--card);border:2px solid #000;padding:6px 4px 0;min-width:0}
.pod .lbav{width:36px;height:36px}.pod.p1 .lbav{width:44px;height:44px;box-shadow:0 0 0 2px var(--gold)}
.pod .pn{font-size:11px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pod .ps{font-family:var(--f-pix);font-size:8px;color:var(--gold)}
.pod .pb{font-family:var(--f-pix);font-size:12px;width:100%;text-align:center;padding:5px 0;margin-top:3px;color:#2a1d05}

const BAY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v=>(v+.5)/16);

    xs.sort((p,q)=>p-q);for(let i=0;i+1<xs.length;i+=2){const xa=Math.round(xs[i]),xb=Math.round(xs[i+1]);if(xb<=xa)continue;if(!fn)C.fillRect(xa,y,xb-xa,1);else for(let x=xa;x<xb;x++)if(fn(x,y)>bay(x,y))C.fillRect(x,y,1,1)}}}

function fUpdate(dt){

  F.shake=Math.max(0,F.shake-dt*25);
  const end=F.phase==='ko'||F.phase==='done',kdw0=F.phase==='kd'?F.kd.who:null;
  const plDown=kdw0==='pl'||(end&&F.winner==='op'),opDown=kdw0==='op'||(end&&F.winner==='pl'),dk=Math.min(1,dt*10);
  F.plSway+=((plDown?0:Math.sin(gym.t*1.7)*1.4)-F.plSway)*(plDown?dk:1);F.opSway+=((opDown?0:Math.sin(gym.t*1.4+1)*1.4)-F.opSway)*(opDown?dk:1);
  const kdW=F.phase==='kd'?F.kd.who:null;F.plOff+=((kdW==='op'?-12:0)-F.plOff)*Math.min(1,dt*4);F.opOff+=((kdW==='pl'?12:0)-F.opOff)*Math.min(1,dt*4);

    if(ts==='block'&&(F.tutBlocked||F.tutHits))tutAdvance();else if(ts==='punch'&&pl.sup>=100)tutAdvance()}
  if(ts==='free'){F.tutT+=dt;if(F.tutT>4)tutAdvance()}
  pl.stam=Math.min(100,pl.stam+dt*(10+Math.min(30,F.ps.sta*.12))*F.stamMul);
  pl.cd-=dt;pl.block-=dt;pl.jT=(pl.jT??9)+dt;if(pl.qp&&pl.cd<=0)playerPunch(false);
  if(pl.waste&&pl.block<=0){pl.waste=false;pl.stam=Math.max(0,pl.stam-12);fFloat(PX,T_("МИМО"),'#9a94aa')}
  if(freeze)return;

  F.idleT+=dt;
  op.t-=dt*(1-op.slow);
  switch(op.st){
    case 'idle':if(op.t<=0){const r=Math.random();
      if(ts==='block'||ts==='punch'||ts==='super'){op.st='windup';op.kind='heavy';op.t=windupDur()}

  }

}

  const now=Date.now();if(now-AN.last<1000)return;AN.last=now;const [pm,im]=anMins();
  if(AN.lastTut==null){AN.lastTut=S.tut;AN.lastProg=S.prog;AN.lastBelts=S.belts.length;AN.pvp=pvpOpen();return}
  if(S.tut>AN.lastTut){if(S.tut>=TUT.length)track('tut_done',TUT.length,pm,im);else track('tut_step',S.tut,TUT[S.tut-1]&&TUT[S.tut-1].id,im)}AN.lastTut=S.tut;
  if(S.prog>AN.lastProg){for(let k=AN.lastProg;k<S.prog;k++)track('opp',k+1,pm,im)}AN.lastProg=S.prog;
  if(S.belts.length>AN.lastBelts){for(let i=AN.lastBelts;i<S.belts.length;i++)track('belt',S.belts[i]+1,pm,im)}AN.lastBelts=S.belts.length;
  const po=pvpOpen();if(po&&!AN.pvp)track('pvp_open','',pm,im);AN.pvp=po;
  if(now-AN.fl>30000){AN.fl=now;anFlush()}}
function anSession(){const d=Math.floor((Date.now()-(S.born||Date.now()))/864e5);
  if(!S.anFirst){S.anFirst=1;if(S.tut>0||S.prog>0||S.wins>0)track('update_open','',LANG);else track('first_open','',LANG)}

let anHiddenAt=0;

  if(document.hidden){anHiddenAt=Date.now();track('sess_end',Math.round((S.play||0)-AN.sess.t0),AN.sess.ads,AN.sess.rw);anFlush(true)}

const numIn=(v,max)=>{v=Number(v);return Number.isFinite(v)?Math.max(0,Math.min(max,Math.floor(v))):0};
function cleanRow(id,d){
  if(!d||typeof d!=='object')return null;
  const nick=String(d.nick||'').replace(/[\u0000-\u001f<>]/g,'').trim().slice(0,16)||T_("Боксёр");
  return {id,nick,best:numIn(d.best,1e9),rating:numIn(d.rating,1e7),belts:numIn(d.belts,1e5),wins:numIn(d.wins,1e7),losses:numIn(d.losses,1e7),gen:numIn(d.gen,1e4)||1,cheat:!!d.cheat,upd:numIn(d.upd,1e14)};
}
async function netInit(){
  try{
    const cl=window.claude;if(!cl||typeof cl.use!=='function'){NET.state='off';lastHtml='';return}
    const [db,user]=await Promise.all([cl.use('db'),cl.use('user')]);
    if(!db){NET.state='off';lastHtml='';return}
    NET.db=db;NET.uid=user?await user.id():null;
    NET.state='live';lastHtml='';
    db.collection('ladder').orderBy('best','desc').limit(100).onSnapshot(snap=>{
      NET.rows=snap.docs.map(d=>cleanRow(d.id,d.data())).filter(Boolean);lastHtml='';
    },e=>{NET.state='err';lastHtml=''});
    netPush(true);
  }catch(e){NET.state='off';lastHtml=''}
}
async function netPush(force){
  if(NET.state!=='live'||!NET.uid||NET.ro||NET.busy)return;
  if(!S.wins&&!S.allBelts&&!S.legacy)return;
  S.best=Math.max(S.best||0,ladderPts());
  const body={nick:myNick(),best:S.best,rating:myRating(),belts:S.allBelts,wins:S.wins,losses:S.losses,gen:S.gen,cheat:S.cheat?1:0};
  const key=JSON.stringify(body);if(key===NET.sent)return;
  NET.busy=true;
  try{await NET.db.doc('ladder/'+NET.uid).set(Object.assign(body,{upd:Date.now()}));NET.sent=key}
  catch(e){if(e&&(e.code==='invalid_argument'||e.code==='not_granted'))NET.ro=true;lastHtml=''}
  NET.busy=false;
}

const LB_FIRST=[T_("Джо"),T_("Тони"),T_("Рик"),T_("Сэм"),T_("Дрю"),T_("Лео"),T_("Кит"),T_("Бен"),T_("Рой"),T_("Дейв"),T_("Ник"),T_("Эл"),T_("Гэри"),T_("Пит"),T_("Карл"),T_("Фрэнк"),T_("Хэнк"),T_("Вэс"),T_("Зак"),T_("Мэтт")];

// 49 rivals spread like a real season: a crowd of newcomers, a middle pack, a few veterans and four legends.
// Each one keeps climbing slowly in real time with a gentle wobble, so ranks shift between visits.
const LB_TIERS=[[12,6,90,1.2,3.6],[15,80,330,2.4,7.8],[12,330,700,3,8],[6,700,1200,3,7],[4,1200,1550,2,5]]; // scaled to the 55-fight ladder (ratings up to ~1200 + belts)
const LB_BOTS=(()=>{const out=[];let i=0;for(const [n,a,b,ga,gb] of LB_TIERS)for(let j=0;j<n;j++,i++){const h=hash(i*7919+13),h2=hash(i*104729+7);
  out.push({id:'b'+i,nick:`${LB_FIRST[(i*7)%20]} «${LB_NICK[(i*13+3+Math.floor(i/20)*7)%20]}» ${LB_LAST[(i*11+5+Math.floor(i/20)*3)%20]}`,s0:a+(h%1000)/1000*(b-a),g:ga+(h2%1000)/1000*(gb-ga),ph:(h2%628)/100,per:1.5+(h2>>>4)%40/10,

  {const k=out[out.length-1];k.nick=T_("Кейн «Император» Карвер");k.s0=1650;k.g=4;k.look=Object.assign({},OPP(54).look,{key:'lbkane'})}

  if(!LBN.rows.size&&Array.isArray(S.lbc))for(const r of S.lbc)if(r&&r.id&&r.look)LBN.rows.set(r.id,r);
  const rows=[];
  const fr=lbFriends&&VK.friends;
  const myVk=VK.user&&VK.user.id,byVk=new Map(); // one VK account on two phones → one row (the fresher)
  for(const r of LBN.rows.values())if(r.vk&&(!byVk.has(r.vk)||byVk.get(r.vk).t<r.t))byVk.set(r.vk,r);
  for(const r of LBN.rows.values()){if(r.id===S.uid||Date.now()-r.t>LB_TTL)continue;if(r.vk&&(r.vk===myVk||byVk.get(r.vk)!==r))continue;if(fr&&!(r.vk&&fr.has(r.vk)))continue;rows.push({id:r.id,nick:r.nick,score:r.score,league:clamp(r.L|0,0,3),belts:r.belts,ph:r.ph,pt:()=>portrait(r.look.key,'boxer',r.look,'#2f4aa8')})}

   Phones on mobile networks can't accept incoming connections, so both connect OUT to a public MQTT relay

   his phone runs the whole fight and broadcasts the state ~10×/s; the other phone sends button presses. */

// --- tiny MQTT 3.1.1 client over WebSocket (QoS 0) ---
class MQ{
  constructor(url,cid,onMsg,onLost,user,pass){Object.assign(this,{url,cid,onMsg,onLost,user,pass,buf:new Uint8Array(0),pid:1,alive:false})}
  static str(s){const b=new TextEncoder().encode(s);return [b.length>>8,b.length&255,...b]}
  static pkt(type,body){const len=[];let n=body.length;do{let b=n%128;n=Math.floor(n/128);if(n)b|=128;len.push(b)}while(n);return new Uint8Array([type,...len,...body])}
  open(){return new Promise((res,rej)=>{let done=false;const fail=e=>{if(done)return;done=true;clearTimeout(to);try{this.ws.close()}catch(_){}rej(e)};
    let ws;try{ws=new WebSocket(this.url,'mqtt')}catch(e){rej(e);return}this.ws=ws;ws.binaryType='arraybuffer';
    const to=setTimeout(()=>fail(new Error('timeout')),7000);
    ws.onopen=()=>ws.send(MQ.pkt(0x10,this.user?[...MQ.str('MQTT'),4,0xC2,0,30,...MQ.str(this.cid),...MQ.str(this.user),...MQ.str(this.pass||'')]:[...MQ.str('MQTT'),4,2,0,30,...MQ.str(this.cid)]));
    ws.onerror=()=>fail(new Error('ws'));
    ws.onclose=()=>{clearInterval(this.pingT);const was=this.alive;this.alive=false;if(!done)fail(new Error('closed'));else if(was&&this.onLost)this.onLost()};
    ws.onmessage=e=>this.feed(new Uint8Array(e.data),()=>{if(done)return;done=true;clearTimeout(to);this.alive=true;this.pingT=setInterval(()=>this.raw(MQ.pkt(0xC0,[])),20000);res()});
  })}
  raw(p){try{if(this.ws&&this.ws.readyState===1)this.ws.send(p)}catch(e){}}
  sub(t){const id=(this.pid++&0xffff)||1;this.raw(MQ.pkt(0x82,[id>>8,id&255,...MQ.str(t),0]))}
  pub(t,s){this.raw(MQ.pkt(0x30,[...MQ.str(t),...new TextEncoder().encode(s)]))}
  pubR(t,s){this.raw(MQ.pkt(0x31,[...MQ.str(t),...new TextEncoder().encode(s)]))} // retained: the relay keeps it for new subscribers
  close(){const w=this.alive;this.alive=false;clearInterval(this.pingT);try{if(w)this.raw(MQ.pkt(0xE0,[]));this.ws&&this.ws.close()}catch(e){}}
  feed(chunk,onAck){const b=new Uint8Array(this.buf.length+chunk.length);b.set(this.buf);b.set(chunk,this.buf.length);this.buf=b;
    for(;;){const B=this.buf;if(B.length<2)return;let mul=1,len=0,i=1,c;do{if(i>=B.length)return;c=B[i++];len+=(c&127)*mul;mul*=128}while(c&128);
      if(B.length<i+len)return;const body=B.subarray(i,i+len),type=B[0]>>4,q=(B[0]>>1)&3;this.buf=B.slice(i+len);
      if(type===2){if(body[1]===0)onAck()}
      else if(type===3){const tl=(body[0]<<8)|body[1],topic=new TextDecoder().decode(body.subarray(2,2+tl)),off=2+tl+(q?2:0);
        try{this.onMsg(topic,new TextDecoder().decode(body.subarray(off)))}catch(e){console.error(e)}}}}
}

  $('sceneTag').textContent=wardOn?T_("ГАРДЕРОБ · ПРИМЕРКА"):HOMES[S.home].n.toUpperCase()+' · '+(slp?T_("СПИТ ДО 7:00 · ФОРМА ×2"):brk?T_("ПЕРЕРЫВ 20 МИН"):EQ[S.focus].n.toUpperCase())+(boostLeft()>0?` ${Tf_("· БУСТ ×3 {0} МИН",Math.ceil(boostLeft()/60000))}`:'');
  const ev=gym.ev,fanAsk=ringView()&&FANS.some(f=>f.st==='ask'),evh=fanAsk?T_("фанаты! тапни — автограф"):ev&&ev.k==='rat'&&ev.st==='run'?T_("лови крысу — она с перчаткой!"):ev&&ev.k==='dark'?T_("в темноте тапы ×2"):(CAT.st==='wait'||CAT.st==='arrive')?T_("тапни кошку"):(S.potBroken&&!gym.pot&&S.rooms.locker&&S.rooms.plant&&!ringView())?T_("тапни осколки — починить горшок"):'';
  $('tapHint').textContent=evh||(slp?T_("тапни — разбудить"):brk?T_("тапни — за работу"):T_("тапни — тренировка"));
  $('tapHint').classList.toggle('top',ringView()||!!evh);
  $('tapHint').hidden=true;$('sceneTag').hidden=true; // the scene speaks for itself: no captions over it
  let h='';for(const s of STAT_KEYS){const st=S.stats[s];const p=Math.min(100,st.x/xpNeed(st.l)*100);
    h+=`<div class="st"><div class="t"><span style="color:${STATS[s].c}">${STATS[s].s}</span><b>${st.l}</b></div><div class="bar"><i style="width:${p.toFixed(1)}%;background:${STATS[s].c}"></i></div><div class="rate">${Tf_("+{0}/с",fmt1(statRate(s)))}</div></div>`}
  if(h!==lastStats){$('stats').innerHTML=h;lastStats=h;if(hlEl&&!document.body.contains(hlEl))tutApply()}
  if(mode==='gym'){renderQuest();badges()}
}
function refreshFightHud(){
  const pl=F.pl,op=F.op;if(F.phase==='kd'&&F.kd.who==='pl')$('upBar').style.width=(F.kd.meter*100)+'%';
  $('plHp').style.width=(pl.hp/pl.max*100)+'%';$('opHp').style.width=(op.hp/op.max*100)+'%';
  $('fTimer').textContent=Math.max(0,Math.ceil(F.time));$('fRound').textContent=Tf_("РАУНД {0}/{1}",F.round,F.rounds);
  $('stamBar').style.width=pl.stam+'%';$('supBar').style.width=pl.sup+'%';
  const live=F.phase==='live';
  $('bPunch').classList.toggle('cue',live&&op.st==='open');
  $('bBlock').classList.toggle('cue',live&&op.st==='windup'&&op.kind==='heavy');
  $('bSuper').classList.toggle('ready',live&&pl.sup>=100);
  $('corner').hidden=F.phase==='kd'&&F.kd.who==='pl';
  if(tutCorner)return;
  const [tk,tc,tt]=cornerTip();if(tk!==F.tipK){F.tipK=tk;const el=$('cnTip');el.className='tip '+tc;el.textContent=tt}
}
function cornerTip(){
  const pl=F.pl,op=F.op,t=F.tactic;
  if(F.phase==='kd'&&F.kd.who==='op')return ['kd','y',T_("Он на полу! Отдышись, пока судья считает.")];
  if(F.phase==='between')return ['btw','',T_("Выбери тактику на раунд — от неё зависит, как пойдёт бой.")];
  if(F.phase!=='live')return [F.tipK,'',$('cnTip').textContent];
  if(op.st==='windup'&&op.kind==='heavy')return ['wu','r',T_("Красный «!» — он замахнулся. БЛОК!")];
  if(op.st==='open')return ['op','g',T_("Раскрылся! БЕЙ — будет крит.")];
  if(pl.sup>=100)return ['sup','y',T_("Суперудар заряжен — жми СУПЕР!")];
  if(pl.stam<25)return ['st','r',T_("Дыхание на нуле. Не маши впустую, подыши.")];
  if(pl.hp/pl.max<.3)return ['lo','r',T_("Держись! Закрывайся и лови момент.")];
  if(op.hp/op.max<.3)return ['fin','g',T_("Он плывёт! Дожимай!")];
  const g={pressure:T_("Дави без пауз — он реже закрывается."),body:T_("Бей по корпусу — он медленнее замахивается."),counter:T_("Блок, потом удар — контратака бьёт втрое.")};
  if(F.time>ROUND_T-3.5)return ['tac'+t,'',g[t]||T_("Работай руками!")];
  return ['watch','m',T_("Наблюдает…")];
}

/* ================= main loop ================= */
let lastT=performance.now(),uiT=0,saveT=0,netT=8,lastTutKey='';
function loop(now){
  if(adPause){lastT=now;requestAnimationFrame(loop);return} // the ad is on screen: game and sound wait
  const dt=Math.min(.1,(now-lastT)/1000);lastT=now;
  try{frame(dt)}catch(e){console.error(e)}
  requestAnimationFrame(loop);
}
function frame(dt){
  tick(dt,mode==='fight');
  if(!ringView()&&fanWasOn){fanWasOn=false;FANS=[]}
  if(PVN.st!=='idle'&&!PV)pvSearchTick(dt);
  lbTick();anTick(dt);
  if(VK.room&&pvpAvailable()&&mode==='gym'&&!PV&&PVN.st==='idle'&&$('modal').hidden&&$('title').hidden&&!CUT&&S.tut>=TUT.length){const c=VK.room;VK.room=null;track('room_join','link');pvSearch(c)}
  rateTick(dt);offerTick(dt);
  if(CUT)cutDraw(dt);
  else if(mode==='fight'&&PV)pvFrame(dt);
  else if(mode==='fight'&&F){const hs=F.hs>0,paused=F.phase==='live'&&!$('modal').hidden;fUpdate(hs||paused?0:dt);chgTick();if(F)drawFight(dt);if(F)refreshFightHud()}
  else if(ringView())drawArenaPreview(dt);
  else if(pvpView())drawPvpPreview(dt);
  else drawGym(dt);
  if(mode==='fight'&&F&&F.tut){const k=S.tut+':'+F.op.st;if(k!==lastTutKey){lastTutKey=k;tutApply()}}
  uiT-=dt;if(uiT<=0){uiT=.25;refreshHud();renderPanel();renderArenaHud();tutCheck();placeHand();if(retireArm>0)retireArm-=.25;if(resetArm>0)resetArm-=.25}
  saveT-=dt;if(saveT<=0){saveT=5;save()}
  netT-=dt;if(netT<=0){netT=20;netPush(false)}
  if(toastT>0){toastT-=dt;if(toastT<=0)$('toast').hidden=true}
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else{const away=(Date.now()-S.last)/1000;if(away>5&&mode==='gym')tick(Math.min(away,OFFLINE_CAP),true);lastT=performance.now()}});
window.addEventListener('pagehide',save);

/* ================= boot ================= */
let pendingOffline=null;
function dailyCheck(){
  if(S.tut<TUT.length)return;
  const d=today();if(S.daily===d)return;
  const y=new Date(Date.now()-864e5),yd=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();
  S.streak=S.daily===yd?S.streak+1:1;S.daily=d;
  const bonus=Math.round(Math.max(50,income()*600)*(1+.1*(Math.min(S.streak,7)-1)));
  queueModal(()=>openModal(`<div class="mh win">${T_("ЕЖЕДНЕВНЫЙ БОНУС")}</div><p>${T_("Спонсор занёс конверт. День подряд:")} <b>${S.streak}</b> ${T_("— каждый день до недели бонус больше.")}</p><div class="rw"><span style="color:var(--gold)">+${CN()}${fmt(bonus)}</span></div>`,[{t:T_("ЗАБРАТЬ"),cls:'gold',fn:()=>{const bb=$('mbox').querySelector('[data-mb]').getBoundingClientRect();S.money+=bonus;hudHold+=bonus;SFX.coin();flyCoins({getBoundingClientRect:()=>bb},bonus);save();closeModal()}}]));
}
function startGame(){
  ac();SFX.click();$('title').hidden=true;MUS.track='';anSession();
  if(pendingOffline)queueModal(pendingOffline);
  dailyCheck();
  startStory();
}
$('playBtn').addEventListener('click',startGame);
function boot(data){
  const hotS=data&&data.S?normalize(data.S):null;const hot=!!hotS;const saved=hotS||load();
  if(saved){
    S=saved;
    if(!S.story||!Array.isArray(S.story.seen))S.story={seen:[]};S.story.seen=S.story.seen.filter(x=>typeof x==='string').slice(0,20);
    if(S.tut>0&&!S.story.seen.includes('prologue'))S.story.seen.push('prologue');
    if(S.tut>0)S.story.pro=1;else if(S.story.pro==null)S.story.pro=S.story.seen.includes('prologue')?1:0;
    {const a=TUT.findIndex(t=>t.id==='tactic'),f=TUT.findIndex(t=>t.id==='fight');if(S.tut>=a&&S.tut<=TUT_FREE)S.tut=f}
    if(!hot){
      const away=Math.min(OFFLINE_CAP,Math.max(0,(Date.now()-(S.last||Date.now()))/1000));
      if(away>60){const m0=S.money,lv0=myRating();tick(away,true);const dm=S.money-m0,dl=myRating()-lv0;
        if(away>=300)pendingOffline=()=>openModal(`<div class="mh">${T_("ПОКА ТЕБЯ НЕ БЫЛО")}</div><p>${Tf_("{0} тренировался {1} ч {2} мин.",esc(boxerName()),Math.floor(away/3600),Math.floor(away%3600/60))}</p><div class="rw"><span style="color:var(--gold)">+${CN()}${fmt(dm)}</span><span style="color:var(--green)">${Tf_("+{0} ур.",dl)}</span></div>`,dm>0&&away>=600&&rwOk('offline')?[{t:T_("ЗАБРАТЬ"),cls:'ghost',fn:closeModal},{t:T_("▶ ×2 МОНЕТЫ"),cls:'blue',fn:()=>showRewarded('offline',()=>{S.money+=dm;closeModal();toast(Tf_("+{0} — доход удвоен",fmt(dm)))})}]:[{t:T_("ДАЛЬШЕ"),cls:'gold',fn:closeModal}])}
    }
    $('playBtn').textContent=T_("ПРОДОЛЖИТЬ");$('titleSub').textContent=Tf_("{0} · рейтинг {1}",boxerName(),myRating());
  }
  try{window.claude?.hot?.snapshot?.(()=>({S}))}catch(e){}
  if(hot)$('title').hidden=true;
  resize();
  setMode('gym');setTab('gym');refreshHud();
  requestAnimationFrame(loop);
  netInit();
}
const HOT=window.claude?.hot;
if(HOT&&HOT.ready)HOT.ready(d=>{boot(d);vkBoot()});else{boot(HOT&&HOT.data||{});vkBoot()}
})();
</script>
